[package]
name = "rumos"
version = "0.0.9"
authors = ["Octagony <moctagony@gmail.com>"]
edition = "2021"
description = "CLI utility for controlling screen brightness"
keywords = ["system","cli","brightness"]
repository = "https://github.com/octagony/rumos"
license = "MIT"
readme = "README.md"


[dependencies]
brightness = "0.5.0"
clap = { version = "4.3.10", features = ["derive"] }
colored = "2.0.4"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
futures = "0.3.28"
toml = "1.1.8"
serde = { version = "1.0", features = ["derive"] }
dirs = "7.0.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
debug = false
lto = true
incremental = true
